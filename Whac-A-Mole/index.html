<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>花園打地鼠</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="home-screen modal-scroll-locked">
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-content">
            <h1>
              <img src="assets/ui/title-logo.png" alt="花園打地鼠" class="title-logo" />
            </h1>
            <p class="sr-only" id="roundStatus">準備敲敲</p>
          </div>
        </div>

        <div class="stats" aria-label="遊戲狀態">
          <div class="stat">
            <span>分數</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>時間</span>
            <strong id="timeLeft">60</strong>
          </div>
          <div class="stat">
            <span>連擊</span>
            <strong id="combo">0</strong>
          </div>
          <div class="stat">
            <span>最佳</span>
            <strong id="bestScore">0</strong>
          </div>
        </div>

        <button class="icon-btn top-settings-btn" id="settingsButton" type="button" aria-label="設定" title="設定">
          <img src="assets/ui/icon-settings.png" alt="" />
          <span class="sr-only">設定</span>
        </button>
      </header>

      <div class="leaf-fall game-leaf-fall" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <main class="stage">
        <section class="playfield" aria-label="打地鼠遊戲區">
          <div class="board" id="board">
            <button class="hole" data-hole="0" aria-label="洞口 1">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="1" aria-label="洞口 2">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="2" aria-label="洞口 3">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="3" aria-label="洞口 4">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="4" aria-label="洞口 5">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="5" aria-label="洞口 6">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="6" aria-label="洞口 7">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="7" aria-label="洞口 8">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
            <button class="hole" data-hole="8" aria-label="洞口 9">
              <span class="mole-holder"><img class="mole-img" alt="" /></span>
              <span class="fx-holder"><img class="fx-img" alt="" /></span>
              <img class="hole-img hole-front" src="assets/ui/hole.png" alt="" />
            </button>
          </div>
          <div class="hammer-cursor" id="hammerCursor" aria-hidden="true"></div>
          <div class="toast" id="toast" aria-live="polite">準備</div>
        </section>
      </main>

      <div class="modal start-modal" id="startOverlay">
        <div class="leaf-fall" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="modal-dialog start-dialog" role="dialog" aria-modal="true" aria-labelledby="startTitle">
          <button class="close-btn start-close-btn" id="closeStartButton" type="button" aria-label="關閉開始視窗">
            <img src="assets/ui/icon-close.png" alt="" />
          </button>
          <button class="icon-btn start-leaderboard-btn" id="startLeaderboardButton" type="button" aria-label="查看排行榜" title="排行榜">
            <img src="assets/ui/icon-leaderboard.png" alt="" />
          </button>
          <h2 id="startTitle" class="start-logo-title">
            <img src="assets/ui/title-logo.png" alt="花園打地鼠" />
          </h2>
          <p class="sr-only">看準時機敲下去，金色地鼠和連擊會把分數拉高。</p>

          <div class="rule-grid" aria-label="角色與規則">
            <article class="rule-card">
              <img src="assets/ui/rule-card-square-normal.png" alt="普通地鼠，敲中加 10 分" />
            </article>
            <article class="rule-card">
              <img src="assets/ui/rule-card-square-gold.png" alt="金色地鼠，稀有出現加 30 分" />
            </article>
            <article class="rule-card">
              <img src="assets/ui/rule-card-square-combo.png" alt="連擊獎勵，三連擊加 5 分" />
            </article>
            <article class="rule-card">
              <img src="assets/ui/rule-card-square-time.png" alt="60 秒挑戰，越後面越多" />
            </article>
          </div>

          <div class="modal-actions">
            <button class="primary-btn home-start-button" id="startButton" type="button" aria-label="開始遊戲">
              <img src="assets/ui/icon-start.png" alt="" />
              <span>開始遊戲</span>
            </button>
          </div>
        </div>
      </div>

      <div class="modal settings-modal" id="settingsOverlay" hidden>
        <div class="modal-dialog small-dialog frame-rules" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
          <button class="close-btn" id="closeSettingsButton" type="button" aria-label="關閉設定">
            <img src="assets/ui/icon-close.png" alt="" />
          </button>
          <h2 id="settingsTitle">設定</h2>

          <div class="settings-list" aria-label="音量設定">
            <div class="volume-row">
              <button class="volume-toggle" id="soundToggleButton" type="button" aria-label="音效靜音">
                <img src="assets/ui/icon-sound.png" alt="" />
              </button>
              <span class="volume-text">音效</span>
              <button class="switch-control" id="soundSwitchButton" type="button" aria-label="切換音效">
                <span class="switch-knob"></span>
              </button>
              <span class="switch-value" id="soundVolumeValue">開</span>
            </div>
            <div class="volume-row">
              <button class="volume-toggle" id="musicToggleButton" type="button" aria-label="音樂靜音">
                <img src="assets/ui/icon-music.png" alt="" />
              </button>
              <span class="volume-text">音樂</span>
              <button class="switch-control" id="musicSwitchButton" type="button" aria-label="切換音樂">
                <span class="switch-knob"></span>
              </button>
              <span class="switch-value" id="musicVolumeValue">開</span>
            </div>
          </div>

          <div class="modal-actions settings-game-actions" id="settingsGameActions">
            <button class="primary-btn" id="resumeButton" type="button">
              <img src="assets/ui/icon-start.png" alt="" />
              <span>繼續遊戲</span>
            </button>
            <button class="primary-btn" id="settingsRestartButton" type="button">
              <img src="assets/ui/icon-retry.png" alt="" />
              <span>重新開始</span>
            </button>
            <button class="ghost-btn" id="pauseEndButton" type="button">
              <img src="assets/ui/icon-end.png" alt="" />
              <span>結束並記錄</span>
            </button>
          </div>
        </div>
      </div>

      <div class="modal result-modal" id="resultOverlay" hidden>
        <div class="modal-dialog result-dialog frame-leaderboard" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
          <img src="assets/ui/mascot.png" alt="" class="result-mascot" />
          <h2 id="resultTitle">時間到！</h2>
          <p id="finalScore">0 分</p>
          <p id="finalMeta">最高連擊 0</p>
          <p id="rankLine">本局排名第 1</p>
          <ol class="leaderboard-list" id="resultLeaderboard"></ol>
          <div class="modal-actions">
            <button class="primary-btn" id="retryButton" type="button">
              <img src="assets/ui/icon-retry.png" alt="" />
              <span>再玩一次</span>
            </button>
            <button class="ghost-btn" id="backToStartButton" type="button">
              <img src="assets/ui/icon-home.png" alt="" />
              <span>回到首頁</span>
            </button>
          </div>
        </div>
      </div>

      <div class="modal leaderboard-modal" id="leaderboardOverlay" hidden>
        <div class="modal-dialog leaderboard-dialog frame-leaderboard" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
          <div class="leaderboard-head">
            <h2 id="leaderboardTitle">排行榜</h2>
            <button class="close-btn" id="closeLeaderboardButton" type="button" aria-label="關閉排行榜">
              <img src="assets/ui/icon-close.png" alt="" />
            </button>
          </div>
          <div class="leaderboard-scroll">
            <ol class="leaderboard-list" id="leaderboardList"></ol>
            <p class="empty-board" id="emptyLeaderboard">還沒有紀錄，第一名正在等你。</p>
          </div>
          <div class="modal-actions leaderboard-actions">
            <button class="ghost-btn danger-text" id="clearLeaderboardButton" type="button">
              <img src="assets/ui/icon-end.png" alt="" />
              <span id="clearLeaderboardLabel">清除紀錄</span>
            </button>
          </div>
        </div>
      </div>

      <audio id="bgmAudio" src="assets/audio/bgm.mp3" preload="none" loop></audio>
    </div>

    <script src="src/game.js" defer></script>
  </body>
</html>
