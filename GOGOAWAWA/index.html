<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GOGO AWAWA!</title>
    <link rel="stylesheet" href="styles.css?v=20260430q" />
  </head>
  <body>
    <main class="game-viewport">
      <section class="game-shell" aria-label="GOGO AWAWA 橫向卷軸跳躍遊戲">
        <canvas id="game" width="1280" height="720" aria-label="GOGO AWAWA game canvas"></canvas>
        <div class="hud" aria-live="polite">
          <p class="score-text">分數 <strong id="score">0</strong></p>
          <div class="hud-actions">
            <button id="settingsButton" class="icon-button" type="button" aria-label="開啟設定"><span aria-hidden="true">⚙</span></button>
            <button id="fullscreenButton" class="icon-button" type="button" aria-label="切換全螢幕"><span aria-hidden="true">⛶</span></button>
          </div>
        </div>
        <section id="settingsPanel" class="settings-panel" aria-hidden="true">
          <div class="settings-card">
            <h2>遊戲設定</h2>
            <label class="slider-row" for="sfxVolume">
              <span>音效</span>
              <input id="sfxVolume" class="wood-slider" type="range" min="0" max="100" value="40" />
            </label>
            <label class="slider-row" for="musicVolume">
              <span>音樂</span>
              <input id="musicVolume" class="wood-slider" type="range" min="0" max="100" value="25" />
            </label>
            <p class="settings-note">可在 <code>assets/audio/</code> 內替換 BGM 與跳躍音效。</p>
            <button id="resumeButton" class="settings-cta" type="button">繼續遊戲</button>
          </div>
        </section>
        <p class="hint">空白鍵 / ↑ / W / 點擊 / 觸控，ESC 暫停</p>
      </section>
    </main>
    <script src="game.js?v=20260430q"></script>
  </body>
</html>
